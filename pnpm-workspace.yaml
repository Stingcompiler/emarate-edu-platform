packages:
  - apps/*
  - packages/*
# Dependency install scripts are blocked by default (pnpm 12); approve only known ones.
allowBuilds:
  esbuild: true
# GHSA-ch52-4w7c-c8xp (via astro, build time only): the fixed release until astro picks it up
# (review 2026-10-04, B11).
minimumReleaseAgeExclude:
  - http-cache-semantics@4.3.0
overrides:
  http-cache-semantics: ">=4.3.0"
  # GHSA-68fv-2mgg-jv7q (source maps, build time) and GHSA-wq5f-xc86-pv6w (sharp's librsvg,
  # image builds): the fixed releases (review 2026-10-08, dependencies).
  source-map-js: ">=1.2.2"
  sharp: ">=0.35.5"
  # Audit 2026-10-25, through astro (build and dev only): vite's dev server and launch-editor
  # (GHSA, 8.3.3), zod memory exhaustion (4.6.6), undici DoS and SRI bypass (8.12.2). Caret, so a
  # new major never arrives through an override.
  vite: "^8.3.3"
  zod: "^4.6.6"
  undici: "^8.12.2"
