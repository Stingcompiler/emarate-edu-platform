<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2b47" />
    <!-- The icons are cut from the logo in the site settings (the built-in ones until it is set). -->
    <link rel="icon" type="image/png" sizes="192x192" href="/api/public/portal-icon/192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/api/public/portal-icon/apple-touch.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="بوابة الكلية" />
    <title>بوابة كلية الإمارات</title>
  </head>
  <body>
    <script>
      // Apply the saved theme before first paint (no flash).
      try {
        var t = localStorage.getItem("ecst-theme");
        if (t === "light" || t === "warm" || t === "dark")
          document.documentElement.setAttribute("data-theme", t);
        if (localStorage.getItem("ecst-density") === "compact")
          document.documentElement.setAttribute("data-density", "compact");
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
